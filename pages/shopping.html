<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FamilyBot — Lista de compras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="app-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">🏠</span><span class="brand-text">FamilyBot</span></div>
    <nav class="sidebar-nav">
      <a class='nav-item' href='dashboard.html'><span class="nav-icon">📊</span><span>Panel</span></a>
      <a class='nav-item' href='members.html'><span class="nav-icon">👪</span><span>Miembros</span></a>
      <a class='nav-item' href='schedule.html'><span class="nav-icon">📅</span><span>Horarios</span></a>
      <a class='nav-item' href='alerts.html'><span class="nav-icon">🔔</span><span>Recordatorios</span><span class="nav-badge" id="alertBadge">0</span></a>
      <a class='nav-item active' href='shopping.html'><span class="nav-icon">🛒</span><span>Compras</span></a>
      <a class='nav-item' href='expenses.html'><span class="nav-icon">💰</span><span>Gastos</span></a>
      <a class='nav-item' href='pets.html'><span class="nav-icon">🐾</span><span>Mascotas</span></a>
      <a class='nav-item' href='settings.html'><span class="nav-icon">⚙️</span><span>Ajustes</span></a>
      <a class='nav-item' href='assistant.html'><span class="nav-icon">🤖</span><span>Asistente IA</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info" id="sidebarUser"></div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Lista de compras</h1>
      <button class="btn-secondary" onclick="clearCheckedShopping()">Limpiar comprados</button>
    </header>

    <div class="page-content">
      <div class="card">
        <div class="shopping-add-row">
          <input type="text" id="shoppingName" class="form-input" placeholder="ej: Leche" onkeydown="handleShoppingKey(event)"/>
          <input type="text" id="shoppingQty" class="form-input small" placeholder="Cantidad" onkeydown="handleShoppingKey(event)"/>
          <button class="btn-primary" onclick="addShoppingItem()">+ Agregar</button>
        </div>
        <div class="shopping-list" id="shoppingList"></div>
        <div class="empty-page" id="shoppingEmpty" style="display:none">
          <div class="empty-big-icon">🛒</div>
          <h2>Lista de compras vacía</h2>
          <p>Agrega productos que necesites comprar para el hogar.</p>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" style="display:none"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/shopping.js"></script>
</body>
</html>
