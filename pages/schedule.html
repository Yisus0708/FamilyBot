<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FamilyBot — Horarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="app-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">🏠</span><span class="brand-text">FamilyBot</span></div>
    <nav class="sidebar-nav">
      <a class='nav-item' href='dashboard.html'><span class="nav-icon">📊</span><span>Panel</span></a>
      <a class='nav-item' href='members.html'><span class="nav-icon">👪</span><span>Miembros</span></a>
      <a class='nav-item active' href='schedule.html'><span class="nav-icon">📅</span><span>Horarios</span></a>
      <a class='nav-item' href='alerts.html'><span class="nav-icon">🔔</span><span>Recordatorios</span><span class="nav-badge" id="alertBadge">0</span></a>
      <a class='nav-item' href='shopping.html'><span class="nav-icon">🛒</span><span>Compras</span></a>
      <a class='nav-item' href='expenses.html'><span class="nav-icon">💰</span><span>Gastos</span></a>
      <a class='nav-item' href='pets.html'><span class="nav-icon">🐾</span><span>Mascotas</span></a>
      <a class='nav-item' href='settings.html'><span class="nav-icon">⚙️</span><span>Ajustes</span></a>
      <a class='nav-item' href='assistant.html'><span class="nav-icon">🤖</span><span>Asistente IA</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info" id="sidebarUser"></div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Horarios y eventos</h1>
      <button class="btn-primary" onclick="openEventModal()">+ Agregar evento</button>
    </header>

    <div class="page-content">
      <!-- WEEK NAVIGATOR -->
      <div class="week-nav">
        <button class="week-btn" onclick="prevWeek()">‹</button>
        <span class="week-label" id="weekLabel"></span>
        <button class="week-btn" onclick="nextWeek()">›</button>
        <button class="week-btn today-btn" onclick="goToday()">Hoy</button>
      </div>

      <!-- CALENDAR WEEK VIEW -->
      <div class="week-grid" id="weekGrid"></div>

      <!-- UPCOMING EVENTS LIST -->
      <div class="card mt-16">
        <div class="card-header">
          <h2>📋 Todos los eventos</h2>
          <div class="filter-row">
            <select id="filterMember" class="form-input small" onchange="filterEvents()">
              <option value="">Todos los miembros</option>
            </select>
            <select id="filterType" class="form-input small" onchange="filterEvents()">
              <option value="">Todos los tipos</option>
              <option value="pickup">Recogida</option>
              <option value="task">Tarea</option>
              <option value="activity">Actividad</option>
              <option value="appointment">Cita</option>
              <option value="sport">Deporte</option>
            </select>
          </div>
        </div>
        <div class="events-list" id="eventsList"></div>
      </div>
    </div>
  </main>

  <!-- EVENT MODAL -->
  <div id="eventModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="eventModalTitle">Nuevo evento</h2>
        <button class="modal-close" onclick="closeEventModal()">✕</button>
      </div>
      <div class="form-group">
        <label>Título del evento</label>
        <input type="text" id="eventTitle" placeholder="ej: Recoger a Sofía" class="form-input"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tipo</label>
          <select id="eventType" class="form-input">
            <option value="pickup">🚗 Recogida</option>
            <option value="task">📚 Tarea</option>
            <option value="activity">🎨 Actividad</option>
            <option value="appointment">🏥 Cita</option>
            <option value="sport">⚽ Deporte</option>
            <option value="other">📌 Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Miembro</label>
          <select id="eventMember" class="form-input">
            <option value="">— Selecciona —</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="eventDate" class="form-input"/>
        </div>
        <div class="form-group">
          <label>Hora</label>
          <input type="time" id="eventTime" class="form-input"/>
        </div>
      </div>
      <div class="form-group">
        <label>Lugar (opcional)</label>
        <input type="text" id="eventLocation" placeholder="ej: Escuela Juan Diego" class="form-input"/>
      </div>
      <div class="form-group">
        <label>Nota (opcional)</label>
        <textarea id="eventNote" placeholder="Detalles adicionales..." class="form-input" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Alertas previas</label>
        <div class="alerts-config">
          <label class="check-label"><input type="checkbox" id="alert15" checked/> 15 min antes</label>
          <label class="check-label"><input type="checkbox" id="alert30"/> 30 min antes</label>
          <label class="check-label"><input type="checkbox" id="alert60"/> 1 hora antes</label>
          <label class="check-label"><input type="checkbox" id="alertDay"/> 1 día antes</label>
        </div>
      </div>
      <div class="form-group">
        <label>¿Se repite?</label>
        <select id="eventRepeat" class="form-input">
          <option value="none">No se repite</option>
          <option value="daily">Cada día</option>
          <option value="weekly">Cada semana</option>
          <option value="weekdays">Días de semana (L–V)</option>
        </select>
      </div>
      <input type="hidden" id="eventEditId"/>
      <div id="eventFormError" class="form-error" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeEventModal()">Cancelar</button>
        <button class="btn-primary" onclick="saveEvent()">Guardar evento</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/schedule.js"></script>
</body>
</html>
