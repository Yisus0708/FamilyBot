<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FamilyBot — Ajustes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="app-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">🏠</span><span class="brand-text">FamilyBot</span></div>
    <nav class="sidebar-nav">
      <a class='nav-item' href='dashboard.html'><span class="nav-icon">📊</span><span>Panel</span></a>
      <a class='nav-item' href='members.html'><span class="nav-icon">👪</span><span>Miembros</span></a>
      <a class='nav-item' href='schedule.html'><span class="nav-icon">📅</span><span>Horarios</span></a>
      <a class='nav-item' href='alerts.html'><span class="nav-icon">🔔</span><span>Recordatorios</span><span class="nav-badge" id="alertBadge">0</span></a>
      <a class='nav-item' href='shopping.html'><span class="nav-icon">🛒</span><span>Compras</span></a>
      <a class='nav-item' href='expenses.html'><span class="nav-icon">💰</span><span>Gastos</span></a>
      <a class='nav-item' href='pets.html'><span class="nav-icon">🐾</span><span>Mascotas</span></a>
      <a class='nav-item active' href='settings.html'><span class="nav-icon">⚙️</span><span>Ajustes</span></a>
      <a class='nav-item' href='assistant.html'><span class="nav-icon">🤖</span><span>Asistente IA</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info" id="sidebarUser"></div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Ajustes</h1>
    </header>

    <div class="page-content">
      <div class="card">
        <div class="card-header"><h2>Panel principal</h2></div>
        <div class="settings-row">
          <div>
            <div class="settings-row-title">Mostrar Gastos del hogar</div>
            <div class="settings-row-desc">Muestra u oculta la tarjeta de Gastos del hogar en el Panel principal.</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleShowExpenses" onchange="onToggleShowExpenses(this.checked)"/>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h2>Clave de API de Gemini</h2></div>
        <div class="settings-row">
          <div>
            <div class="settings-row-title">Clave actual</div>
            <div class="settings-row-desc" id="currentApiKeyDisplay">No has guardado ninguna clave.</div>
          </div>
        </div>
        <div class="form-group">
          <label>Nueva API Key</label>
          <input type="password" id="newApiKeyInput" placeholder="Pega aquí tu nueva API Key de Gemini..." class="form-input"/>
        </div>
        <div id="apiKeyFormError" class="form-error" style="display:none"></div>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="clearApiKey()">Eliminar clave</button>
          <button class="btn-primary" onclick="updateApiKey()">Guardar nueva clave</button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" style="display:none"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
