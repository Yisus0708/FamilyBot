<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FamilyBot — Mascotas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="app-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">🏠</span><span class="brand-text">FamilyBot</span></div>
    <nav class="sidebar-nav">
      <a class='nav-item' href='dashboard.html'><span class="nav-icon">📊</span><span>Panel</span></a>
      <a class='nav-item' href='members.html'><span class="nav-icon">👪</span><span>Miembros</span></a>
      <a class='nav-item' href='schedule.html'><span class="nav-icon">📅</span><span>Horarios</span></a>
      <a class='nav-item' href='alerts.html'><span class="nav-icon">🔔</span><span>Recordatorios</span><span class="nav-badge" id="alertBadge">0</span></a>
      <a class='nav-item' href='shopping.html'><span class="nav-icon">🛒</span><span>Compras</span></a>
      <a class='nav-item' href='expenses.html'><span class="nav-icon">💰</span><span>Gastos</span></a>
      <a class='nav-item active' href='pets.html'><span class="nav-icon">🐾</span><span>Mascotas</span></a>
      <a class='nav-item' href='settings.html'><span class="nav-icon">⚙️</span><span>Ajustes</span></a>
      <a class='nav-item' href='assistant.html'><span class="nav-icon">🤖</span><span>Asistente IA</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info" id="sidebarUser"></div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 class="page-title">Mascotas registradas</h1>
      <button class="btn-primary" onclick="openPetModal()">+ Agregar mascota</button>
    </header>

    <div class="page-content">
      <div class="members-grid" id="petsGrid"></div>
      <div class="empty-page" id="petsEmpty" style="display:none">
        <div class="empty-big-icon">🐾</div>
        <h2>Aún no has agregado mascotas</h2>
        <p>Registra a tus mascotas para tenerlas presentes en tu panel familiar.</p>
        <button class="btn-primary" onclick="openPetModal()">Agregar primera mascota</button>
      </div>
    </div>
  </main>

  <!-- PET MODAL -->
  <div id="petModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="petModalTitle">Agregar mascota</h2>
        <button class="modal-close" onclick="closePetModal()">✕</button>
      </div>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="petName" placeholder="Nombre de la mascota" class="form-input"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tipo</label>
          <input type="text" id="petSpecies" placeholder="ej: Perro, Gato" class="form-input"/>
        </div>
        <div class="form-group">
          <label>Raza (opcional)</label>
          <input type="text" id="petBreed" placeholder="ej: Labrador" class="form-input"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>¿Tiene vacunas?</label>
          <select id="petHasVaccine" class="form-input" onchange="onPetHasVaccineChange()">
            <option value="no">No</option>
            <option value="si">Sí</option>
          </select>
        </div>
        <div class="form-group">
          <label>¿Cuántas vacunas tiene?</label>
          <input type="number" id="petVaccineCount" placeholder="0" min="0" class="form-input" disabled/>
        </div>
      </div>
      <div class="form-group">
        <label>Notas (opcional)</label>
        <textarea id="petNotes" placeholder="Alimentación, veterinario, etc." class="form-input" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Color de identificación</label>
        <div class="color-picker" id="petColorPicker">
          <button class="color-btn active" data-color="#4F8EF7" style="background:#4F8EF7"></button>
          <button class="color-btn" data-color="#F74F6C" style="background:#F74F6C"></button>
          <button class="color-btn" data-color="#4FC87F" style="background:#4FC87F"></button>
          <button class="color-btn" data-color="#F7B24F" style="background:#F7B24F"></button>
          <button class="color-btn" data-color="#9B4FF7" style="background:#9B4FF7"></button>
          <button class="color-btn" data-color="#F74FC8" style="background:#F74FC8"></button>
        </div>
      </div>
      <input type="hidden" id="petEditId"/>
      <div id="petFormError" class="form-error" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closePetModal()">Cancelar</button>
        <button class="btn-primary" onclick="savePet()">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pets.js"></script>
</body>
</html>
